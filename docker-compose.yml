services:
  # 1. Base de Datos MariaDB (biblioteca + glpi_db con soporte utf8mb4)
  glpi-db:
    image: mariadb:10.11
    container_name: glpi-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=glpi_db
      - MARIADB_CHARACTER_SET_SERVER=utf8mb4
      - MARIADB_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 2. Sistema GLPI (Gestor de Activos e Inventario)
  glpi:
    image: glpi/glpi:latest
    container_name: glpi-prod
    restart: always
    ports:
      - "8080:80"
    environment:
      - GLPI_DB_HOST=glpi-db
      - GLPI_DB_NAME=glpi_db
      - GLPI_DB_USER=root
      - GLPI_DB_PASSWORD=root_pass
    depends_on:
      - glpi-db
    volumes:
      - glpi_data_prod:/var/www/html/glpi

  # 3. Backend Laravel (API REST)
  laravel-backend:
    build:
      context: ./server-laravel
      dockerfile: Dockerfile
    container_name: laravel-prod
    restart: always
    ports:
      - "8000:80"
    env_file:
      - ./server-laravel/.env
    depends_on:
      - glpi-db
      - glpi
    volumes:
      - ./server-laravel/storage:/var/www/html/storage

  # 4. Servidor de pruebas de correo (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-prod
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpit_data:/data

volumes:
  mariadb_data:
  glpi_data_prod:
  mailpit_data: